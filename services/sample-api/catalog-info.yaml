# sample-api の Backstage のエンティティ。Component と、それが出す API を同じファイルに書く。
# API の定義はこのディレクトリの openapi.yaml を $text で読む (app.py が配るものと同じファイル)。
# 環境 (dev・prod) ごとの接続先は注釈 home-k8s/environments と home-k8s/env.<環境>.<キー> で持つ
# (規約は docs/cluster/environments.md)。repo の直下の catalog-info.yaml の Location がこのファイルを読む。
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: sample-api
  description: 環境 (dev・prod) ごとに動かすサンプルの API。Backstage の環境ごとのタブの確かめ役
  annotations:
    github.com/project-slug: yamakura-yuma/home-k8s
    home-k8s/environments: dev,prod
    home-k8s/env.dev.api-proxy: /sample-api-dev
    home-k8s/env.prod.api-proxy: /sample-api-prod
    # Grafana のタブ。host の id は backstage/app-config.yaml の grafana.hosts、タグは env-grafana のダッシュボードの tags。
    # grafana/* はこのエンティティ自身には書かない (書くと観測スタックの Grafana の既定のカードがここにも出る)
    home-k8s/env.dev.grafana-host-id: dev
    home-k8s/env.dev.grafana-dashboard-selector: sample-api
    home-k8s/env.prod.grafana-host-id: prod
    home-k8s/env.prod.grafana-dashboard-selector: sample-api
    # 環境ごとの ArgoCD の Application (ApplicationSet sample-api が作る)。ArgoCD のタブが同期状態と健全性を出す
    home-k8s/env.dev.argocd-app-name: sample-api-dev
    home-k8s/env.prod.argocd-app-name: sample-api-prod
    # Azure のタブが探す App Service・Functions の名前 (部分一致)。実際のサブスクリプションに同名のリソースを置くと出る
    home-k8s/env.dev.azure-web-sites: sample-api-dev
    home-k8s/env.prod.azure-web-sites: sample-api-prod
    # 環境ごとの Temporal Web UI。ブラウザが開く URL で、kind-config の extraPortMappings のホストのポート (docs/cluster/temporal.md)
    home-k8s/env.dev.temporal-url: https://temporal-dev.taild2b611.ts.net
    home-k8s/env.prod.temporal-url: https://temporal-prod.taild2b611.ts.net
spec:
  type: service
  lifecycle: experimental
  owner: user:yamakura-yuma
  providesApis:
    - sample-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: sample-api
  description: sample-api の HTTP API (OpenAPI 3)
spec:
  type: openapi
  lifecycle: experimental
  owner: user:yamakura-yuma
  definition:
    $text: ./openapi.yaml
