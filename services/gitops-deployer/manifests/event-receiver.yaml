# event-receiver: Knative Service。Kafka Broker の Trigger から CloudEvent を受け、Temporal の Workflow に Signal を送る。
# イベントが来たら 0→1 に起き、来なくなると 0 に戻る (scale to zero)。クラスタの中からだけ呼べる (cluster-local)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: event-receiver
  namespace: gitops-deployer
  labels:
    networking.knative.dev/visibility: cluster-local
    app.kubernetes.io/part-of: gitops-deployer
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-receiver
        app.kubernetes.io/part-of: gitops-deployer
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "1"
    spec:
      serviceAccountName: event-receiver
      timeoutSeconds: 30
      containers:
        - image: kind.local/home-k8s-gitops-deployer:0.1.2
          command: [/usr/local/bin/event-receiver]
          envFrom:
            - configMapRef:
                name: gitops-deployer
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          # Knative は Pod の securityContext を既定で受け付けない (kubernetes.podspec-securitycontext)。コンテナの側に書く
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
