# Knative Eventing の配線。ApiServerSource (namespace argocd の Application のうち、ApplicationSet gitops-deployer-apps が作ったもの)
# → Kafka Broker default → Trigger → event-receiver。届かなければ指数バックオフで 5 回打ち直し、尽きたら Dead Letter の
# Kafka Broker dead-letter へ (Trigger を持たない。イベントは Kafka のトピック knative-broker-gitops-deployer-dead-letter に残る。
# 基盤は KafkaSink の data plane を入れていないので、Broker を置き場にする)。Trigger は ordered (パーティションの中の順を守る)
apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  name: default
  namespace: gitops-deployer
  annotations:
    eventing.knative.dev/broker.class: Kafka
spec:
  config:
    apiVersion: v1
    kind: ConfigMap
    name: kafka-broker-config
    namespace: knative-eventing
---
apiVersion: sources.knative.dev/v1
kind: ApiServerSource
metadata:
  name: argocd-applications
  namespace: gitops-deployer
spec:
  # data は Application そのもの (status.sync・status.health を読む)
  mode: Resource
  serviceAccountName: argocd-application-watcher
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: argocd
  resources:
    - apiVersion: argoproj.io/v1alpha1
      kind: Application
      selector:
        matchExpressions:
          - key: gitops-deployer.home-k8s/app
            operator: Exists
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: default
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: argocd-application-changes
  namespace: gitops-deployer
  annotations:
    kafka.eventing.knative.dev/delivery.order: ordered
spec:
  broker: default
  filters:
    - prefix:
        type: dev.knative.apiserver.resource.
  subscriber:
    ref:
      apiVersion: serving.knative.dev/v1
      kind: Service
      name: event-receiver
  delivery:
    retry: 5
    backoffPolicy: exponential
    backoffDelay: PT1S
    timeout: PT30S
    deadLetterSink:
      ref:
        apiVersion: eventing.knative.dev/v1
        kind: Broker
        name: dead-letter
---
apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  name: dead-letter
  namespace: gitops-deployer
  annotations:
    eventing.knative.dev/broker.class: Kafka
spec:
  config:
    apiVersion: v1
    kind: ConfigMap
    name: kafka-broker-config
    namespace: knative-eventing
