# dev の Grafana。ホストの localhost:3001 で開く (NodePort 30301 + kind の extraPortMappings。kind-config は Temporal の PR #86 が足した)
service:
  nodePort: 30301
# Keycloak の client grafana-dev。root_url は OAuth のコールバック (<これ>/login/generic_oauth) の元で、client の redirect URI と同じ
grafana.ini:
  server:
    root_url: https://grafana-dev.taild2b611.ts.net
  auth.generic_oauth:
    client_id: grafana-dev
