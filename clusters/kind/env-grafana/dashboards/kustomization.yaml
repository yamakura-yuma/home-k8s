# 環境 (dev・prod) ごとの Grafana のダッシュボードの ConfigMap を repo の JSON から作る (ArgoCD の ApplicationSet env-grafana が
# 環境の namespace に同期する)。ConfigMap は grafana-values の dashboardsConfigMaps で provider のディレクトリにマウントする。
# JSON を足したり消したりしたら、ここの files も直す。
# JSON の tags は Backstage の注釈 home-k8s/env.<環境>.grafana-dashboard-selector に合わせる (docs/cluster/backstage-grafana.md)。
generatorOptions:
  # 名前を固定し、values.yaml から名前で参照する。中身が変わるとマウントしたファイルが入れ替わり、Grafana が読み直す
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboards-default
    files:
      - sample-api.json
