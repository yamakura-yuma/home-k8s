# argoproj/argo-helm の argo-cd chart の values。
# 初回は `just up` が helm でこの values を使って入れ、以後は Application argocd
# (apps/argocd.yaml) が同じ chart・同じ版・同じ values で自分自身を同期する。
# 版を上げるときは just/argocd.just と apps/argocd.yaml の両方を揃える。

# ホストの localhost:8080 で開く (NodePort + kind の extraPortMappings)。
# 127.0.0.1 にしか出さないので TLS は付けず、argocd-server を HTTP で動かす。
configs:
  params:
    server.insecure: true
  cm:
    # Backstage が Application の同期状態と健全性を読む、読み取り専用のアカウント。apiKey は API トークンだけで入れる
    # (パスワードでのログインはできない)。トークンは `just up` が作り、Git の外のファイルから Secret backstage-argocd にする
    # (just/argocd-secrets.sh、docs/cluster/backstage-argocd.md)
    accounts.backstage: apiKey
    # root が子の Application のヘルスを引き継ぐようにする。ArgoCD は既定では
    # Application のヘルスを評価しないので、子が Degraded でも root は Healthy のままになる
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  rbac:
    # backstage のアカウントには Application の取得 (get) だけを許す。作成・同期・削除・ログ・Secret は許さない。
    # 既定の role (policy.default) は空のままなので、ここに書いた以外はすべて拒否される
    policy.csv: |
      p, role:backstage-readonly, applications, get, */*, allow
      g, backstage, role:backstage-readonly
server:
  service:
    type: NodePort
    nodePortHttp: 30080

# ログインは admin だけ使う (パスワードは argocd-initial-admin-secret)。SSO も通知も使わない
dex:
  enabled: false
notifications:
  enabled: false
