# testkube (namespace testkube、Cloud に繋がない standalone の agent)。試験の定義 (TestWorkflow) は clusters/kind/testkube/manifests。
# 基盤の全体と試験の走らせ方は docs/cluster/gitops-deployer-platform.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: testkube
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubeshop.github.io/helm-charts
      chart: testkube
      targetRevision: 2.14.1
      helm:
        releaseName: testkube
        valueFiles:
          - $values/clusters/kind/testkube/values.yaml
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: main
      ref: values
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: main
      path: clusters/kind/testkube/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: testkube
  # NATS の subchart は affinity・nodeSelector・securityContext を null で描き、API server が保存時に落とす (または {} にする)。
  # 落ちた差で OutOfSync が消えないので、この StatefulSet の該当する欄だけ比べない
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: testkube-nats
      jsonPointers:
        - /spec/template/spec/affinity
        - /spec/template/spec/nodeSelector
        - /spec/template/spec/securityContext
        - /spec/template/spec/containers/0/securityContext
        - /spec/template/spec/containers/1/securityContext
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD (TestWorkflow など) が大きく、client-side apply の注釈の上限を超える
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
