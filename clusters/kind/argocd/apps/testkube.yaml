# testkube (namespace testkube、Cloud に繋がない standalone の agent)。試験の定義 (TestWorkflow) は clusters/kind/testkube/manifests。
# 基盤の全体と試験の走らせ方は docs/cluster/gitops-deployer-platform.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: testkube
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubeshop.github.io/helm-charts
      chart: testkube
      targetRevision: 2.14.1
      helm:
        releaseName: testkube
        valueFiles:
          - $values/clusters/kind/testkube/values.yaml
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: main
      ref: values
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: main
      path: clusters/kind/testkube/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: testkube
  # NATS の StatefulSet は volumeClaimTemplates に apiVersion・kind・status を書かず、API server が保存時に足す。
  # 足された差で OutOfSync が消えないので、この 3 つだけ比べない (本番 kind-study-kind で 1 つずつ外して確かめた)
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: testkube-nats
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.status
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD (TestWorkflow など) が大きく、client-side apply の注釈の上限を超える
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
