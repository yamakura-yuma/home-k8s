# Loki (ログ・イベントの保存先)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 18.13.7
      helm:
        releaseName: loki
        valueFiles:
          - $values/clusters/kind/observability/loki-values.yaml
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: verify/gitops-deployer-platform
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
