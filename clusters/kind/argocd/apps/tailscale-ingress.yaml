# 既存の UI を tailnet に出す Ingress (ingressClassName: tailscale)。operator が Ingress ごとに proxy を立て、
# https://<tls.hosts の名前>.<tailnet>.ts.net で開ける (証明書は Tailscale が Let's Encrypt から取る)。
# Ingress は UI の Service と同じ namespace に要るので、各 manifest が namespace を書く。UI の chart と values は変えない。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yamakura-yuma/home-k8s
    targetRevision: main
    path: clusters/kind/tailscale/ingress
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
