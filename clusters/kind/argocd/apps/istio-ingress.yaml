# Istio が実装する Gateway API の Gateway (clusters/kind/istio/gateway、namespace istio-ingress)。
# 外向きの gateway (→ APISIX) と、Knative Serving のクラスタ内向けの knative-local-gateway。基盤の全体は docs/cluster/gitops-deployer-platform.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yamakura-yuma/home-k8s
    targetRevision: main
    path: clusters/kind/istio/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Gateway API の CRD (Application gateway-api) と istiod が先に要る。無い間は失敗するので再試行する
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - SkipDryRunOnMissingResource=true
