# 環境 (dev・prod) ごとの Loki (単一バイナリ)。環境の OTel Collector が、その環境の sample-api のログを OTLP で入れる。
# 永続化なし・保持は短い (docs/cluster/backstage-grafana.md)。規約は docs/cluster/environments.md。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: env-loki
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: prod
  template:
    metadata:
      name: 'env-loki-{{.env}}'
    spec:
      project: default
      sources:
        - repoURL: https://grafana-community.github.io/helm-charts
          chart: loki
          targetRevision: 18.13.7
          helm:
            releaseName: loki
            valueFiles:
              - $values/clusters/kind/env-loki/values.yaml
              - $values/clusters/kind/env-loki/values-{{.env}}.yaml
        - repoURL: https://github.com/yamakura-yuma/home-k8s
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
