# Keycloak のグループ (admins・viewers) に Kubernetes の権限を結ぶ RBAC (clusters/kind/auth/rbac)。
# kubectl (kubelogin) と Headlamp の OIDC のログインがこの権限に従う。構成は docs/cluster/kube-oidc.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oidc-rbac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yamakura-yuma/home-k8s
    targetRevision: main
    path: clusters/kind/auth/rbac
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
