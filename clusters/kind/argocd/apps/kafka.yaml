# Kafka (Strimzi、KRaft、1 ノード、namespace kafka)。clusters/kind/kafka/kafka.yaml。operator と CRD は Application strimzi。
# Knative の Kafka Broker と Dapr の pub/sub が共用する。基盤の全体は docs/cluster/gitops-deployer-platform.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yamakura-yuma/home-k8s
    targetRevision: main
    path: clusters/kind/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Kafka・KafkaNodePool の CRD (Application strimzi) が先に要る。無い間は失敗するので再試行する
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - SkipDryRunOnMissingResource=true
