# istio-cni (cni chart、ambient の profile)。ambient の Pod の通信をノードの ztunnel へ向け替える。
# values は clusters/kind/istio/cni-values.yaml。版は 4 つの chart (istio-base・istiod・istio-cni・ztunnel) でそろえる。
# 基盤の全体は docs/cluster/gitops-deployer-platform.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: cni
      targetRevision: 1.30.5
      helm:
        releaseName: istio-cni
        valueFiles:
          - $values/clusters/kind/istio/cni-values.yaml
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: verify/gitops-deployer-platform
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
