# ztunnel (ztunnel chart)。各ノードで ambient の Pod の通信を mTLS (HBONE) で包む。
# values は clusters/kind/istio/ztunnel-values.yaml。版は 4 つの chart (istio-base・istiod・istio-cni・ztunnel) でそろえる。
# 基盤の全体は docs/cluster/gitops-deployer-platform.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztunnel
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: ztunnel
      targetRevision: 1.30.5
      helm:
        releaseName: ztunnel
        valueFiles:
          - $values/clusters/kind/istio/ztunnel-values.yaml
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
