# gitops-deployer の 6 つの Pod・Knative Eventing の配線・Dapr の設定・Kafka のトピック・Temporal の namespace・testkube の E2E
# (services/gitops-deployer/manifests)。namespace と Dapr の Component は基盤の Application gitops-deployer。構成は docs/cluster/gitops-deployer.md。
# イメージ kind.local/home-k8s-gitops-deployer は `just up` が build して kind load する (just/gitops-deployer.just)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-deployer-services
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yamakura-yuma/home-k8s
    targetRevision: main
    path: services/gitops-deployer/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-deployer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Knative・Dapr・Strimzi・testkube の CRD と namespace gitops-deployer (基盤) が先に要る。無い間は失敗するので再試行する
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - SkipDryRunOnMissingResource=true
