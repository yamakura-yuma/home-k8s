# Prometheus (メトリクスの保存先)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.35.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/clusters/kind/observability/prometheus-values.yaml
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: verify/gitops-deployer-platform
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
