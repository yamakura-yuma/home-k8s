# gitops-deployer の namespace (gitops-deployer は Istio ambient、gitops-deployer-apps) と Dapr の Component (state store・pub/sub)。
# clusters/kind/gitops-deployer。アプリ本体 (services/gitops-deployer) は後続の PR。基盤の全体は docs/cluster/gitops-deployer-platform.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-deployer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yamakura-yuma/home-k8s
    targetRevision: main
    path: clusters/kind/gitops-deployer
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-deployer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Component の CRD (Application dapr) が先に要る。無い間は失敗するので再試行する
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - SkipDryRunOnMissingResource=true
