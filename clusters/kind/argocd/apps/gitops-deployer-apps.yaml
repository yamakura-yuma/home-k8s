# gitops-deployer の Workflow がデプロイするアプリ。git-activity が main に入れた deploys/<名前>/ (PR で auto-merge) ごとに
# Application deploy-<名前> を 1 つ作り、namespace gitops-deployer-apps に同期する。ディレクトリが消えれば Application も消え、
# finalizer がアプリのリソースを片付ける。Application のラベル gitops-deployer.home-k8s/app を ApiServerSource が見て、
# 変化を event-receiver 経由で Workflow に Signal する (docs/cluster/gitops-deployer.md)。
# just ci は git の directory generator を、作業ツリーの deploys/* で Application に展開して描画する。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-deployer-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/yamakura-yuma/home-k8s
        revision: main
        directories:
          - path: deploys/*
        # 既定の 3 分より早く、merge した deploys/ を拾う (Workflow の待ちが短くなる)
        requeueAfterSeconds: 30
  template:
    metadata:
      name: 'deploy-{{.path.basename}}'
      labels:
        gitops-deployer.home-k8s/app: '{{.path.basename}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/yamakura-yuma/home-k8s
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: gitops-deployer-apps
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
