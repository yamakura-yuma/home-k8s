# Backstage。tailnet の https://backstage.<tailnet>.ts.net (Keycloak でログイン) と localhost:7007 (ゲスト) で開き、home-k8s のエンティティのページに Grafana のダッシュボードの一覧を出す。
# イメージは `just up` が手元で build して kind load する (GHCR は使わない)。
# Grafana を読む資格情報は `just up` が作る Secret backstage-grafana を名前で参照する。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://backstage.github.io/charts
      chart: backstage
      targetRevision: 2.10.2
      helm:
        releaseName: backstage
        valueFiles:
          - $values/clusters/kind/backstage/values.yaml
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: main
      ref: values
    # tailnet の入口の proxy (ゲストのサインインの経路を拒む。clusters/kind/backstage/tailnet-proxy)
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: main
      path: clusters/kind/backstage/tailnet-proxy
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
