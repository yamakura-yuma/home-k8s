# 環境 (dev・prod) ごとの Tempo (単一バイナリ)。環境の OTel Collector がトレースを OTLP で入れる。
# 永続化なし・保持は短い (docs/cluster/backstage-grafana.md)。規約は docs/cluster/environments.md。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: env-tempo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
  template:
    metadata:
      name: 'env-tempo-{{.env}}'
    spec:
      project: default
      sources:
        - repoURL: https://grafana-community.github.io/helm-charts
          chart: tempo
          targetRevision: 3.0.0
          helm:
            releaseName: tempo
            valueFiles:
              - $values/clusters/kind/env-tempo/values.yaml
              - $values/clusters/kind/env-tempo/values-{{.env}}.yaml
        - repoURL: https://github.com/yamakura-yuma/home-k8s
          targetRevision: verify/gitops-deployer-platform
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
