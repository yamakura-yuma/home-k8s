# Strimzi の Kafka operator (namespace kafka)。CRD (Kafka・KafkaNodePool・KafkaTopic など) と operator を入れる。
# Kafka 本体は Application kafka (clusters/kind/kafka/kafka.yaml)。基盤の全体は docs/cluster/gitops-deployer-platform.md。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  annotations:
    # CRD を、それを使う Application (wave 0) より先に入れる
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: 1.2.0
      helm:
        releaseName: strimzi
        valueFiles:
          - $values/clusters/kind/strimzi/values.yaml
    - repoURL: https://github.com/yamakura-yuma/home-k8s
      targetRevision: verify/gitops-deployer-platform
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD (Kafka など) が大きく、client-side apply の注釈の上限を超える
      - ServerSideApply=true
