# 環境 (dev・prod) ごとのサンプルの API (services/sample-api)。1 つの kind の中で namespace を環境にし、
# 同じ manifest を list generator の要素ごとに Application sample-api-<環境> として同期する
# (規約は docs/cluster/environments.md)。環境ごとに置くもの (Temporal・観測スタック) も、この形の ApplicationSet を足す。
# 要素の env は namespace の名前で、Backstage の注釈 home-k8s/environments の並びと揃える。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-api
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
  template:
    metadata:
      name: 'sample-api-{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/yamakura-yuma/home-k8s
        targetRevision: verify/gitops-deployer-platform
        path: services/sample-api
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
