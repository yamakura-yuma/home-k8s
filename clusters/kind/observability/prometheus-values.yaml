# prometheus-community/prometheus chart の values。
# Claude Code のメトリクスを OTel Collector から OTLP (/api/v1/otlp) で受ける。
# Kubernetes 自体の監視もこのスタックの目的に含める。grafana.com の Kubernetes ダッシュボード
# (docs/observability/grafana-com-dashboards.md) が前提にする kube-state-metrics・node-exporter・
# cAdvisor・kubelet・API サーバー・CoreDNS のメトリクスは、下の scrapeConfigs とサブチャートでスクレイプする。
# 保存は Tempo と同じく PV (prometheus、clusters/kind/storage) で、WSL2 ホストの
# ~/.local/share/home-k8s/observability/prometheus につながっている (docs/cluster/persistence.md)。
server:
  extraFlags:
    - web.enable-lifecycle
    # OTLP で送られたメトリクスを受ける (/api/v1/otlp/v1/metrics)
    - web.enable-otlp-receiver
    # OTLP の開始時刻 (StartTimeUnixNano) に 0 の点を入れる。短いセッションは点が 1〜2 個しか
    # 無く、これが無いと increase() が最初の送信分 (多くは全量) を取りこぼす
    - enable-feature=created-timestamp-zero-ingestion,promql-extended-range-selectors
  retention: 14d # Tempo に揃える
  # OTLP のリソース属性は既定では target_info にしか残らない。
  # ワーカーごとに絞れるよう Orca が付ける属性と、grafana.com 15983 のための service.instance.id を
  # 各系列のラベルに昇格させる (ラベル名は . が _ になり orca_worktree_name などになる)。
  # 15983 (OTel Collector) の変数 divider は service_instance_id ラベルを前提にしている
  # (service.instance.id は instance ラベルにもなるが、15983 はそれを読まない)。
  # Claude Code はこの属性を送らないので、Claude Code の系列は増えない
  otlp:
    promote_resource_attributes:
      - orca.worktree.id
      - orca.worktree.name
      - service.instance.id
  # PVC prometheus-server を /data にマウントし、TSDB をその根に置く。PV prometheus が claimRef で待っている。
  # ノードは PV の nodeAffinity が決めるので nodeSelector は要らない
  persistentVolume:
    enabled: true
    storageClass: home-k8s-local
    volumeName: prometheus
  # local の volume は fsGroup (chart の既定 65534) でグループを付け替える。
  # 毎回の再帰的な付け替えを避け、根の所有が違うときだけ付け替える
  securityContext:
    fsGroupChangePolicy: OnRootMismatch

# chart 既定のスクレイプ対象のうち、grafana.com の Kubernetes ダッシュボード (dotdc 15757〜15762) が
# 使うメトリクスを出す 4 つだけを使う。ほかは使うダッシュボードが無いので切ったままにする
scrapeConfigs:
  prometheus:
    enabled: false
  # apiserver_* (15761 API Server)
  kubernetes-api-servers:
    enabled: true
  # kubelet_volume_stats_* (kubelet 自身。15758 Namespaces・15759 Nodes の Persistent Volumes)。
  # PVC は docs/cluster/persistence.md の 4 つ。kubelet は 1 ノード 2000 余りの系列を出すが、
  # ダッシュボードが使うのはこれだけなので、ほかは捨てる
  kubernetes-nodes:
    enabled: true
    # 15759 は node ラベルで絞る。cAdvisor と同じく kubelet はこれを付けないので、ノード名から足す
    post_relabel_configs: |
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: kubelet_volume_stats_.+
        action: keep
  # container_* / machine_* (kubelet の cAdvisor。15757 Global・15758 Namespaces・15760 Pods)
  kubernetes-nodes-cadvisor:
    enabled: true
    # dotdc は container_* / machine_* を node ラベルで絞る (15759 Nodes の Pod 別 CPU・メモリ)。
    # kubelet の cAdvisor はこのラベルを付けず、chart の既定の relabel も付けないので、ノード名から足す
    post_relabel_configs: |
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
  # prometheus.io/scrape 注釈の付いた Service。kube-state-metrics (kube_*)・node-exporter (node_*) と、
  # kind の CoreDNS (Service kube-dns に注釈が既にある。coredns_*、15762 CoreDNS) がこれで取れる
  kubernetes-service-endpoints:
    enabled: true
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

# kube_* と node_* を出すサブチャート。どちらも Service に prometheus.io/scrape 注釈を付けるので、
# 上の kubernetes-service-endpoints が拾う
kube-state-metrics:
  enabled: true
  # kube_<リソース>_labels は、ここに挙げたリソースにしか出ない。dotdc 15758 Namespaces は
  # これで Deployment・StatefulSet・DaemonSet・NetworkPolicy の数を数えるので、この 4 つを出す。
  # ラベルを昇格させたいわけではないので、キーは系列が増えない 1 つにとどめる
  metricLabelsAllowlist:
    - deployments=[app.kubernetes.io/name]
    - statefulsets=[app.kubernetes.io/name]
    - daemonsets=[app.kubernetes.io/name]
    - networkpolicies=[app.kubernetes.io/name]
prometheus-node-exporter:
  enabled: true

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
