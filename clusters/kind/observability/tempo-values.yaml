# grafana-community/tempo chart (単一バイナリ構成) の values。
# トレースはオブジェクトストレージではなくローカルファイルに置く。保存先は
# kind の extraMounts で WSL2 ホストの ~/.local/share/home-k8s/observability に
# つながっており、クラスタを作り直しても残る (docs/observability/claude-code-traces.md)。
tempo:
  retention: 336h # 14日
  reportingEnabled: false
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
        # 受け取った時刻から離れたスパンを、ブロックの時間範囲に入れる上限 (既定 2m)。
        # 既定では orca-exporter が終わってから送る Task / Run (開始が数時間〜数日前) の範囲が
        # 受け取った時刻に丸められ、検索でその時刻の範囲を指定しても見つからない。保存期間に揃える
        ingestion_time_range_slack: 336h
  # 新しいトレースを持つ live-store の WAL にも同じ上限を入れる (上の storage.trace.wal とは別の設定)
  liveStore:
    wal:
      path: /var/tempo/live-store/traces
      ingestion_time_range_slack: 336h
  # TraceQL metrics (ダッシュボードの集計) と検索・タグ一覧で引ける期間。保存期間 (336h) に揃える。
  # 既定 (metrics 24h、search 168h) のままだと Grafana の「Last 7 days」が端数の分だけ
  # 168h を超えて `time range exceeds the maximum` で失敗する。
  queryFrontend:
    metrics:
      max_duration: 336h
    search:
      max_duration: 336h
  extraVolumeMounts:
    - name: tempo-data
      mountPath: /var/tempo

# extraMounts を持つ worker にだけ置く (clusters/kind/kind-config.yaml の labels)
nodeSelector:
  home-k8s/observability-storage: "true"

extraVolumes:
  - name: tempo-data
    hostPath:
      path: /var/local/home-k8s/observability/tempo
      type: DirectoryOrCreate

# hostPath は root 所有で作られるため、Tempo の実行ユーザー (10001) に渡してから起動する
initContainers:
  - name: chown-tempo-data
    image: busybox:1.37
    command: ["chown", "-R", "10001:10001", "/var/tempo"]
    securityContext:
      runAsUser: 0
      runAsNonRoot: false
    volumeMounts:
      - name: tempo-data
        mountPath: /var/tempo
