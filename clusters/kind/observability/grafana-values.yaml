# grafana-community/grafana chart の values。
# ホストの localhost:3000 で開く (NodePort + kind の extraPortMappings)。
# ローカル専用なので匿名アクセスを Admin 権限で通し、ログイン画面を出さない。
# 設定は provisioning で入るため、Grafana 自体の永続化はしない。
service:
  type: NodePort
  nodePort: 30300

# 未指定だと chart が upgrade のたびに乱数で作り直し、Pod が毎回再起動する。
# 匿名アクセスで入るため、この admin は使わない。
adminPassword: admin

grafana.ini:
  auth:
    disable_login_form: true
  auth.anonymous:
    enabled: true
    org_role: Admin
  analytics:
    reporting_enabled: false
    check_for_updates: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        isDefault: true
        editable: false

# ダッシュボードは JSON をリポジトリに置き、provisioning で読み込む。
# 中身は `just observe-up` が --set-file で dashboards.default.<名前>.json に流し込む
# (chart が ConfigMap にして下の path へマウントする)。
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        type: file
        disableDeletion: true
        # UI での変更は保存できても Pod の再起動で消える。直すときは JSON を編集する
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default
