# grafana-community/grafana chart の values。
# ホストの localhost:3000 で開く (NodePort + kind の extraPortMappings)。
# Quick Tunnel で外に出すこともあるため、匿名アクセスは付けずログインを必須にする。
# データソースとリポジトリのダッシュボードは provisioning で入る。UI で作ったダッシュボード・ユーザー・設定は
# grafana.db に入り、PV grafana (clusters/kind/storage) に残す (docs/cluster/persistence.md)。
service:
  type: NodePort
  nodePort: 30300

# PVC grafana を /var/lib/grafana にマウントする。PV grafana が claimRef で待っている。
# volumeName を書くのは、chart が既存 PVC の volumeName を lookup で引こうとし、
# ArgoCD (helm template で描く) ではそれが空になるため
persistence:
  enabled: true
  storageClassName: home-k8s-local
  volumeName: grafana
# sqlite の grafana.db (RWO) を新旧 2 つの Pod が同時に開かないよう、古い Pod を消してから作る
deploymentStrategy:
  type: Recreate
# 所有者は fsGroup (chart の既定 472) で付け替わるので、chown の initContainer は要らない
initChownData:
  enabled: false
securityContext:
  fsGroupChangePolicy: OnRootMismatch

# admin のパスワードは `just up` が作る Secret から読む。値はリポジトリに置かない。
# chart に Secret を作らせると upgrade のたびに乱数で作り直し、Pod が毎回再起動する。
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# Grafana が Secret の admin のパスワードを使うのは、grafana.db が空の初回だけ。永続化した後は
# パスワードファイルを書き換えても DB の値のままになり、下のサイドカーも admin で入れなくなる。
# そこで起動のたびに、Grafana の前に grafana cli で DB の admin (id 1) のパスワードを Secret の値にそろえる。
# イメージは distroless で sh が無いので、同じイメージの grafana バイナリを exec 形式で直接打つ
# (DB が空でも動く。DB の場所は環境変数 GF_PATHS_DATA の既定 /var/lib/grafana)
extraInitContainers:
  - name: reset-admin-password
    # Grafana 本体と同じイメージ。extraInitContainers は chart が tpl に通すので、chart の版に追従する
    image: "docker.io/grafana/grafana:{{ .Chart.AppVersion }}-distroless"
    command:
      - /usr/share/grafana/bin/grafana
      - cli
      - --homepath=/usr/share/grafana
      - --config=/etc/grafana/grafana.ini
      - admin
      - reset-admin-password
      - $(ADMIN_PASSWORD)
    env:
      - name: ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: grafana-admin
            key: admin-password
    volumeMounts:
      - name: config
        mountPath: /etc/grafana/grafana.ini
        subPath: grafana.ini
      - name: storage
        mountPath: /var/lib/grafana

# 閲覧用ユーザー viewer (Viewer ロール。share Pod が人の代わりに入る)。Grafana の横にサイドカーを置き、Pod の起動ごとに
# 一度だけ HTTP API で viewer を Secret の値にそろえる (居なければ作り、居ればパスワードを変える)。
# Grafana のイメージは distroless で sh が無く、postStart の exec では作れないため別コンテナにする。
# パスワードは `just up` が作る Secret grafana-viewer から読む。値はリポジトリに置かない。
# viewer のパスワードを変えるのは、ファイルを書き換えて `just up` を打つときだけ (Pod の再起動で反映される)。
# サイドカーの環境変数は Pod の起動時の値のままで、実行中に変わった値を読み直せないので、そろえるのは起動時の一度だけにし、そのあとは寝て待つ
# (コンテナが終わると再起動でまた打つので終わらせない)。
# 同じサイドカーが Backstage 用の閲覧用ユーザー backstage (パスワードは Secret grafana-backstage) もそろえる。
# Secret が無いあいだは何もしない (optional)。ユーザーを足すときは、環境変数を足して最後の upsert を 1 行足す。
# ここは chart が tpl に通すので、二重波括弧を書かないこと
extraContainers: |
  - name: viewer-user
    image: curlimages/curl:8.16.0
    env:
      - name: ADMIN_USER
        valueFrom:
          secretKeyRef:
            name: grafana-admin
            key: admin-user
      - name: ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: grafana-admin
            key: admin-password
      - name: VIEWER_PASSWORD
        valueFrom:
          secretKeyRef:
            name: grafana-viewer
            key: password
      # Backstage が Grafana を読むための閲覧用ユーザー backstage のパスワード (`just up` が作る Secret)
      - name: BACKSTAGE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: grafana-backstage
            key: password
            optional: true
    command:
      - sh
      - -c
      - |
        api=http://127.0.0.1:3000/api
        # Grafana が起動するまで待つ
        until curl -sf -o /dev/null "$api/health"; do sleep 2; done
        # upsert <login> <password>: 居なければ作り、居ればパスワードを変える
        upsert() {
          id=$(curl -sf -u "$ADMIN_USER:$ADMIN_PASSWORD" "$api/users/lookup?loginOrEmail=$1" \
            | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
          if [ -z "$id" ]; then
            # 新しいユーザーのロールは auto_assign_org_role (下の grafana.ini で Viewer)
            printf '{"name":"%s","login":"%s","password":"%s"}' "$1" "$1" "$2" \
              | curl -sf -o /dev/null -u "$ADMIN_USER:$ADMIN_PASSWORD" \
                  -H 'Content-Type: application/json' --data-binary @- "$api/admin/users" \
              && echo "$1 を作った" || echo "$1 を作れなかった" >&2
          else
            printf '{"password":"%s"}' "$2" \
              | curl -sf -o /dev/null -u "$ADMIN_USER:$ADMIN_PASSWORD" -X PUT \
                  -H 'Content-Type: application/json' --data-binary @- "$api/admin/users/$id/password" \
              && echo "$1 のパスワードを Secret の値にそろえた" || echo "$1 のパスワードを変えられなかった" >&2
          fi
        }
        upsert viewer "$VIEWER_PASSWORD"
        if [ -n "$BACKSTAGE_PASSWORD" ]; then upsert backstage "$BACKSTAGE_PASSWORD"; fi
        while true; do sleep 3600; done

grafana.ini:
  # OAuth のコールバック (<これ>/login/generic_oauth) とリンクの元。Keycloak の client grafana の redirect URI と同じ (tailnet の名前)。
  # localhost:3000 でもパスワードでは入れる
  server:
    root_url: https://grafana.taild2b611.ts.net
  auth.anonymous:
    enabled: false
  # Keycloak (realm home-k8s) の OIDC でログインする (generic_oauth)。グループ admins は Admin、viewers は Viewer、どちらでもなければ
  # role_attribute_strict でログインを断る。ロールはログインのたびに groups から付け直す。
  # ログインフォームと Basic 認証 (admin・viewer・backstage) は残す: admin は非常用、viewer と backstage は share Pod と Backstage のプロキシが使う。
  # client_secret は環境変数 GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (下の envValueFrom。Secret grafana-oidc は `just up` の _oidc-secrets が作る)。
  # token_url と api_url は Pod から引く。CoreDNS の読み替えでブラウザと同じ URL・証明書で届く (docs/cluster/keycloak.md)
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    client_id: grafana
    scopes: openid profile email groups
    auth_url: https://keycloak.taild2b611.ts.net/realms/home-k8s/protocol/openid-connect/auth
    token_url: https://keycloak.taild2b611.ts.net/realms/home-k8s/protocol/openid-connect/token
    api_url: https://keycloak.taild2b611.ts.net/realms/home-k8s/protocol/openid-connect/userinfo
    signout_redirect_url: https://keycloak.taild2b611.ts.net/realms/home-k8s/protocol/openid-connect/logout
    use_pkce: true
    allow_sign_up: true
    login_attribute_path: preferred_username
    name_attribute_path: name
    email_attribute_path: email
    groups_attribute_path: groups
    role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || contains(groups[*], 'viewers') && 'Viewer'"
    role_attribute_strict: true
  users:
    auto_assign_org_role: Viewer
  analytics:
    reporting_enabled: false
    check_for_updates: false
  # ログイン直後のホームを「Claude Code はじめに」にする (下の provisioning で置かれるファイル)
  dashboards:
    default_home_dashboard_path: /var/lib/grafana/dashboards/default/claude-code-start.json

# Keycloak の client の secret (auth.generic_oauth、`just up` の _oidc-secrets が Git の外のファイルから作る)
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oidc
      key: client-secret

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        isDefault: true
        editable: false
        jsonData:
          # タグ一覧をダッシュボードの時間範囲 (最長 14 日) で引く。未設定だと時間範囲なしで引き、
          # Tempo はごく最近のブロックのタグしか返さない。変数「ツール」が
          # `Scope for tag span.tool_name not found` で失敗していた原因
          timeRangeForTags: 1209600
          # スパンから、同じトレースの Claude Code イベント (Loki) へ飛ぶ。
          # イベントは trace_id を structured metadata として持つ
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            customQuery: true
            query: '{service_name="claude-code"} | trace_id="$${__trace.traceId}"'
          # スパンから、同じモデル・同じワーカーのメトリクス (Prometheus) へ飛ぶ
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: -30m
            spanEndTimeShift: 30m
            tags:
              - key: model
            queries:
              - name: コスト (USD/時)
                query: sum by (model) (rate(claude_code_cost_usage_USD_total{$$__tags}[5m])) * 3600
              - name: トークン (種類別/分)
                query: sum by (type) (rate(claude_code_token_usage_tokens_total{$$__tags}[5m])) * 60
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        editable: false
        jsonData:
          # Claude Code は 60 秒ごとに送るので、rate() の窓はその 4 倍を下限にする
          timeInterval: 1m
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        editable: false
        jsonData:
          # イベントの structured metadata trace_id から、Tempo のトレースへ飛ぶ
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: "$${__value.raw}"
              urlDisplayLabel: トレースを開く
      # 各バックエンドの HTTP API (Prometheus の系列一覧、Tempo のタグ一覧、Loki のクエリ) の JSON を
      # 表にするためのデータソース。claude-code-raw ダッシュボードが属性キーの一覧を出すのに使う。
      # PromQL / TraceQL / LogQL にはキーの一覧を返す書き方が無いため、API を直接叩く
      - name: Backend API
        uid: backend-api
        type: yesoreyeram-infinity-datasource
        access: proxy
        editable: false
        jsonData:
          allowedHosts:
            - http://prometheus-server.observability.svc.cluster.local
            - http://tempo.observability.svc.cluster.local:3200
            - http://loki.observability.svc.cluster.local:3100

# Backend API データソースのプラグイン。Grafana 13.2 に合う版に固定する
plugins:
  - yesoreyeram-infinity-datasource@4.0.0

# ダッシュボードは JSON をリポジトリに置き、provisioning で読み込む。
# JSON は dashboards/kustomization.yaml が provider ごとの ConfigMap にし (ArgoCD の Application grafana が
# 同期する)、下の dashboardsConfigMaps が /var/lib/grafana/dashboards/<provider> にマウントする。
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        type: file
        disableDeletion: true
        # UI での変更も保存できるが、正本はリポジトリの JSON。直すときは JSON を編集する
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default
      # 設定項目 (環境変数) ごとのダッシュボード。dashboards/settings/*.json
      - name: settings
        orgId: 1
        type: file
        folder: Claude Code 設定項目別
        folderUid: cc-settings
        disableDeletion: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/settings
      # grafana.com の公開ダッシュボード (dashboards/grafana-com/、docs/observability/grafana-com-dashboards.md)。
      # 上の 2 つとは混ぜず、群ごとに provider とフォルダを分ける。ConfigMap は provider ごとに 1 つで、
      # ConfigMap は 1 MiB までなので、群を 1 つにまとめると大きくなりすぎる。JSON は fetch.py が作る
      - name: grafana-com-kubernetes
        orgId: 1
        type: file
        folder: grafana.com / Kubernetes
        folderUid: gcom-kubernetes
        disableDeletion: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/grafana-com-kubernetes
      - name: grafana-com-opentelemetry
        orgId: 1
        type: file
        folder: grafana.com / OpenTelemetry
        folderUid: gcom-opentelemetry
        disableDeletion: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/grafana-com-opentelemetry
      - name: grafana-com-claude-code
        orgId: 1
        type: file
        folder: grafana.com / Claude Code
        folderUid: gcom-claude-code
        disableDeletion: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/grafana-com-claude-code

# provider の名前 → ConfigMap の名前 (dashboards/kustomization.yaml の configMapGenerator)
dashboardsConfigMaps:
  default: grafana-dashboards-default
  settings: grafana-dashboards-settings
  grafana-com-kubernetes: grafana-dashboards-grafana-com-kubernetes
  grafana-com-opentelemetry: grafana-dashboards-grafana-com-opentelemetry
  grafana-com-claude-code: grafana-dashboards-grafana-com-claude-code
