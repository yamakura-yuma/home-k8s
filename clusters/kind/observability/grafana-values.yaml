# grafana-community/grafana chart の values。
# ホストの localhost:3000 で開く (NodePort + kind の extraPortMappings)。
# Quick Tunnel で外に出すこともあるため、匿名アクセスは付けずログインを必須にする。
# 設定は provisioning で入るため、Grafana 自体の永続化はしない。
service:
  type: NodePort
  nodePort: 30300

# admin のパスワードは `just observe-up` が作る Secret から読む。値はリポジトリに置かない。
# chart に Secret を作らせると upgrade のたびに乱数で作り直し、Pod が毎回再起動する。
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

grafana.ini:
  auth.anonymous:
    enabled: false
  analytics:
    reporting_enabled: false
    check_for_updates: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        isDefault: true
        editable: false

# ダッシュボードは JSON をリポジトリに置き、provisioning で読み込む。
# 中身は `just observe-up` が --set-file で dashboards.default.<名前>.json に流し込む
# (chart が ConfigMap にして下の path へマウントする)。
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        type: file
        disableDeletion: true
        # UI での変更は保存できても Pod の再起動で消える。直すときは JSON を編集する
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default
