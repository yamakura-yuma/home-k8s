# grafana-community/grafana chart の values。
# ホストの localhost:3000 で開く (NodePort + kind の extraPortMappings)。
# Quick Tunnel で外に出すこともあるため、匿名アクセスは付けずログインを必須にする。
# 設定は provisioning で入るため、Grafana 自体の永続化はしない。
service:
  type: NodePort
  nodePort: 30300

# admin のパスワードは `just observe-up` が作る Secret から読む。値はリポジトリに置かない。
# chart に Secret を作らせると upgrade のたびに乱数で作り直し、Pod が毎回再起動する。
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

grafana.ini:
  auth.anonymous:
    enabled: false
  analytics:
    reporting_enabled: false
    check_for_updates: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        isDefault: true
        editable: false
        jsonData:
          # スパンから、同じトレースの Claude Code イベント (Loki) へ飛ぶ。
          # イベントは trace_id を structured metadata として持つ
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            customQuery: true
            query: '{service_name="claude-code"} | trace_id="$${__trace.traceId}"'
          # スパンから、同じモデル・同じワーカーのメトリクス (Prometheus) へ飛ぶ
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: -30m
            spanEndTimeShift: 30m
            tags:
              - key: model
            queries:
              - name: コスト (USD/時)
                query: sum by (model) (rate(claude_code_cost_usage_USD_total{$$__tags}[5m])) * 3600
              - name: トークン (種類別/分)
                query: sum by (type) (rate(claude_code_token_usage_tokens_total{$$__tags}[5m])) * 60
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local
        editable: false
        jsonData:
          # Claude Code は 60 秒ごとに送るので、rate() の窓はその 4 倍を下限にする
          timeInterval: 1m
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        editable: false
        jsonData:
          # イベントの structured metadata trace_id から、Tempo のトレースへ飛ぶ
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: "$${__value.raw}"
              urlDisplayLabel: トレースを開く

# ダッシュボードは JSON をリポジトリに置き、provisioning で読み込む。
# 中身は `just observe-up` が --set-file で dashboards.default.<名前>.json に流し込む
# (chart が ConfigMap にして下の path へマウントする)。
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        type: file
        disableDeletion: true
        # UI での変更は保存できても Pod の再起動で消える。直すときは JSON を編集する
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default
