# open-telemetry/opentelemetry-collector chart の values。
# Claude Code (WSL2 ホスト) から OTLP を受け、トレースを Tempo、メトリクスを Prometheus、
# ログを Loki に中継する。3 つとも OTLP のまま渡す (docs/observability/claude-code-traces.md)。
# 受け口は NodePort + kind の extraPortMappings (clusters/kind/kind-config.yaml) で
# ホストの localhost:4318 (HTTP) / localhost:4317 (gRPC) に出している。
mode: deployment

image:
  # 最小構成の k8s ディストリビューション。otlp receiver/exporter と batch を含む。
  repository: otel/opentelemetry-collector-k8s

service:
  type: NodePort

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    nodePort: 30317
    # chart の既定は hostPort も開けるが、ホストへの公開は NodePort 経由に一本化する
    hostPort: null
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    nodePort: 30318
    hostPort: null
    protocol: TCP
  # トレース以外の受け口は使わないので閉じる
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    # chart 既定の jaeger/zipkin/prometheus receiver は使わない
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    # 秘密っぽい値を Tempo / Loki に入れる前に伏せる (docs/observability/claude-code-improve.md)。
    # Claude Code は依頼文 (prompt)・ツールの詳細 (Bash のコマンド、ファイルパス)・応答文を
    # 属性に入れて送るので、ログとスパンの属性の全部と、ログ本文に同じ規則を当てる。
    # 規則は 3 本: PEM の秘密鍵ブロック / キーワードの後ろの値 (Authorization, Bearer,
    # password) / 形で分かるトークン (sk-, ghp_, github_pat_, AKIA, xoxb- など)。
    # $${1} は Collector の設定で $ を書く書き方で、キーワード部分を残して値だけを置き換える。
    transform/redact:
      error_mode: ignore
      log_statements:
        - replace_all_patterns(log.attributes, "value", "(?s)-----BEGIN[A-Z ]*PRIVATE KEY-----.*?(-----END[A-Z ]*PRIVATE KEY-----|$)", "<REDACTED>")
        - replace_all_patterns(log.attributes, "value", "(?i)(authorization[\"']?\\s*[:=]\\s*[\"']?(?:(?:bearer|basic|token)\\s+)?|\\bbearer\\s+|--password[= ]\\s*|\\bpassword[\"']?\\s*[:=]\\s*[\"']?)[^\\s\"'\\\\,;&]+", "$${1}<REDACTED>")
        - replace_all_patterns(log.attributes, "value", "\\b(sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|(AKIA|ASIA)[0-9A-Z]{16}|xox[abprs]-[A-Za-z0-9-]{10,})", "<REDACTED>")
        - replace_pattern(log.body, "(?s)-----BEGIN[A-Z ]*PRIVATE KEY-----.*?(-----END[A-Z ]*PRIVATE KEY-----|$)", "<REDACTED>")
        - replace_pattern(log.body, "(?i)(authorization[\"']?\\s*[:=]\\s*[\"']?(?:(?:bearer|basic|token)\\s+)?|\\bbearer\\s+|--password[= ]\\s*|\\bpassword[\"']?\\s*[:=]\\s*[\"']?)[^\\s\"'\\\\,;&]+", "$${1}<REDACTED>")
        - replace_pattern(log.body, "\\b(sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|(AKIA|ASIA)[0-9A-Z]{16}|xox[abprs]-[A-Za-z0-9-]{10,})", "<REDACTED>")
      trace_statements:
        - replace_all_patterns(span.attributes, "value", "(?s)-----BEGIN[A-Z ]*PRIVATE KEY-----.*?(-----END[A-Z ]*PRIVATE KEY-----|$)", "<REDACTED>")
        - replace_all_patterns(span.attributes, "value", "(?i)(authorization[\"']?\\s*[:=]\\s*[\"']?(?:(?:bearer|basic|token)\\s+)?|\\bbearer\\s+|--password[= ]\\s*|\\bpassword[\"']?\\s*[:=]\\s*[\"']?)[^\\s\"'\\\\,;&]+", "$${1}<REDACTED>")
        - replace_all_patterns(span.attributes, "value", "\\b(sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|(AKIA|ASIA)[0-9A-Z]{16}|xox[abprs]-[A-Za-z0-9-]{10,})", "<REDACTED>")
  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    # Prometheus の OTLP 受信 (--web.enable-otlp-receiver)。/v1/metrics は exporter が付ける
    otlp_http/prometheus:
      metrics_endpoint: http://prometheus-server.observability.svc.cluster.local/api/v1/otlp/v1/metrics
      tls:
        insecure: true
    # Loki 3 の OTLP 受信。/v1/logs は exporter が付ける
    otlp_http/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      tls:
        insecure: true
  service:
    # Collector 自身のメトリクス (otelcol_*) を、Claude Code のメトリクスと同じく Prometheus の
    # OTLP 受信に直接送る。grafana.com の OpenTelemetry Collector ダッシュボード (15983) が読む。
    # スクレイプの対象を増やさずに済む。readers はリストなので chart 既定の pull (:8888) も書き直して残す
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
          # 15983 のパネルは最小間隔 10s で $__rate_interval が 40s になる。既定の 60s ごとの送信では
          # 窓に点が 1 つしか入らず rate() が空になるので、10s ごとに送る (系列は 50 程度で小さい)
          - periodic:
              interval: 10000
              exporter:
                otlp:
                  protocol: http/protobuf
                  endpoint: http://prometheus-server.observability.svc.cluster.local/api/v1/otlp/v1/metrics
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, transform/redact, batch]
        exporters: [otlp_grpc/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, transform/redact, batch]
        exporters: [otlp_http/loki]
