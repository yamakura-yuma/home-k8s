# open-telemetry/opentelemetry-collector chart の values。
# Claude Code (WSL2 ホスト) から OTLP を受け、トレースを Tempo に中継する。
# 受け口は NodePort + kind の extraPortMappings (clusters/kind/kind-config.yaml) で
# ホストの localhost:4318 (HTTP) / localhost:4317 (gRPC) に出している。
mode: deployment

image:
  # 最小構成の k8s ディストリビューション。otlp receiver/exporter と batch を含む。
  repository: otel/opentelemetry-collector-k8s

service:
  type: NodePort

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    nodePort: 30317
    # chart の既定は hostPort も開けるが、ホストへの公開は NodePort 経由に一本化する
    hostPort: null
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    nodePort: 30318
    hostPort: null
    protocol: TCP
  # トレース以外の受け口は使わないので閉じる
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    # chart 既定の jaeger/zipkin/prometheus receiver は使わない
    jaeger: null
    zipkin: null
    prometheus: null
  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo]
      # Claude Code はメトリクスとログも OTLP で出せるが、いまは受け口が無いので捨てる
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
