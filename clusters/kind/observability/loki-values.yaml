# grafana-community/loki chart (単一バイナリ構成) の values。
# Claude Code のログ (イベント) を OTel Collector から OTLP (/otlp) で受ける。
# 保存は Tempo と同じく PV (loki、clusters/kind/storage) で、WSL2 ホストの
# ~/.local/share/home-k8s/observability/loki につながっている (docs/cluster/persistence.md)。
deploymentMode: Monolithic

loki:
  # local の volume は fsGroup (chart の既定 10001) でグループを付け替える。
  # 毎回の再帰的な付け替えを避け、根の所有が違うときだけ付け替える
  podSecurityContext:
    fsGroupChangePolicy: OnRootMismatch
  # マルチテナントにしない (X-Scope-OrgID ヘッダ無しで読み書きする)
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-09-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 336h # 14日 (Tempo に揃える)
    # OTLP のリソース属性・ログ属性は structured metadata として残す (Loki 3 の既定)
    allow_structured_metadata: true
    volume_enabled: true
    # 古い時刻のログを受け取る上限。既定 (1w) では、orca-exporter が初回にまとめて送る
    # 1 週間より前のメッセージが捨てられる。保存期間に揃える (docs/observability/orca-orchestration.md)
    reject_old_samples_max_age: 336h
  # 保持期間を過ぎたログは compactor が消す
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  # PVC storage-loki-0 を /var/loki にマウントする。PV loki が claimRef で待っている。
  # ノードは PV の nodeAffinity が決めるので nodeSelector は要らない
  persistence:
    enabled: true
    storageClass: home-k8s-local

# 単一構成では使わない部品を止める
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
sidecar:
  rules:
    enabled: false
# chart の既定は SimpleScalable の read/write/backend にも replicas を持たせているので 0 にする
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
