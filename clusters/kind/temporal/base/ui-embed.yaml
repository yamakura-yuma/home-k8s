# Temporal の Web UI を iframe に出すための proxy (Caddyfile)。ホストからは Service temporal-ui-embed の NodePort で開く
# (dev 30233 → localhost:8233、prod 30234 → localhost:8234。kind-config の extraPortMappings につながり、NodePort は overlays/<環境> が決める)。
# 開くのは localhost だけ (kind-config の listenAddress が 127.0.0.1)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui-embed
  labels:
    app.kubernetes.io/name: temporal-ui-embed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-ui-embed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-ui-embed
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2.11.6-alpine
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/caddy-config
            - name: XDG_DATA_HOME
              value: /tmp/caddy-data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          # 公式イメージの caddy には file capability (cap_net_bind_service) が付いていて、bounding set から落とすと exec が EPERM になる
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddyfile
          configMap:
            name: temporal-ui-embed
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui-embed
  labels:
    app.kubernetes.io/name: temporal-ui-embed
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: temporal-ui-embed
  ports:
    - name: http
      port: 80
      targetPort: http
