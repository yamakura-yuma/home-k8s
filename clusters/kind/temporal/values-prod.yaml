# prod の Temporal。共通の values.yaml に重ねる差分。
server:
  config:
    namespaces:
      namespace:
        - name: default
          retention: 7d

# Web UI のログイン (Keycloak の client temporal-prod)。callback は tailnet の URL (Ingress → temporal-ui-embed → temporal-web)。
# client の secret は Secret temporal-oidc (just up の _oidc-secrets が Git の外のファイルから作る)。
# REDIRECT_TO_PROVIDER は、ログインのボタンを挟まず Keycloak へ送る (Backstage のタブの iframe でも、Keycloak のセッションがあればそのまま入れる)
web:
  additionalEnv:
    - name: TEMPORAL_AUTH_ENABLED
      value: "true"
    - name: TEMPORAL_AUTH_TYPE
      value: oidc
    - name: TEMPORAL_AUTH_PROVIDER_URL
      value: https://keycloak.taild2b611.ts.net/realms/home-k8s
    - name: TEMPORAL_AUTH_CLIENT_ID
      value: temporal-prod
    - name: TEMPORAL_AUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: temporal-oidc
          key: client-secret
    - name: TEMPORAL_AUTH_CALLBACK_URL
      value: https://temporal-prod.taild2b611.ts.net/auth/sso/callback
    - name: TEMPORAL_AUTH_SCOPES
      value: openid,profile,email
    - name: TEMPORAL_AUTH_REDIRECT_TO_PROVIDER
      value: "true"
