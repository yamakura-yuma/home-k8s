# Keycloak の DB を毎日 pg_dump で書き出す。書き出し先は DB とは別の local PV keycloak-postgres-dump (clusters/kind/storage) で、
# 中身はホストの ~/.local/share/home-k8s/observability/keycloak-postgres-dump/ に残る。14 日より古いものは消す。
# 手で走らせる・戻すときの手順は docs/cluster/keycloak.md の「バックアップと戻し方」。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres-dump
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: home-k8s-local
  volumeName: keycloak-postgres-dump
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-pg-dump
  labels:
    app.kubernetes.io/name: keycloak-pg-dump
spec:
  schedule: "0 4 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keycloak-pg-dump
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              # DB と同じイメージ (pg_dump の版を DB に合わせる)
              image: postgres:17.6-alpine
              env:
                - name: PGHOST
                  value: keycloak-postgres
                - name: PGDATABASE
                  value: keycloak
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-postgres
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-postgres
                      key: password
              # 書きかけのファイルを残さないよう、.part に書いてから名前を替える。dump はパスワードのハッシュを含むので本人だけが読める権限にする
              command:
                - sh
                - -euc
                - |
                  umask 077
                  f="/backup/keycloak-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  pg_dump --no-owner --clean --if-exists | gzip > "$f.part"
                  mv "$f.part" "$f"
                  find /backup -name 'keycloak-*.sql.gz' -mtime +14 -delete
                  ls -l /backup
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: keycloak-postgres-dump
