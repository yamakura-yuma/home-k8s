kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: study-kind
nodes:
  - role: control-plane
    # API server の OIDC (Keycloak の ID トークン。docs/cluster/kube-oidc.md)。clusters/kind/kube-apiserver を
    # `just up` がホストの ${HOME}/.local/share/home-k8s/kube-apiserver に置き、ノードの /etc/kubernetes/home-k8s に見せる。
    # ディレクトリごと見せるので、just up が置き直した authentication-config.yaml を API server が読み直す。
    extraMounts:
      - hostPath: ${HOME}/.local/share/home-k8s/kube-apiserver
        containerPath: /etc/kubernetes/home-k8s
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            - name: authentication-config
              value: /etc/kubernetes/home-k8s/authentication-config.yaml
          extraVolumes:
            - name: home-k8s
              hostPath: /etc/kubernetes/home-k8s
              mountPath: /etc/kubernetes/home-k8s
              readOnly: true
              pathType: Directory
      - |
        kind: InitConfiguration
        patches:
          directory: /etc/kubernetes/home-k8s/patches
    # 観測スタック (docs/observability/claude-code-traces.md) の受け口と、各画面。
    # NodePort はどのノードでも受けられるので、ホストへの公開は control-plane に集約する。
    extraPortMappings:
      - containerPort: 30318 # OTel Collector OTLP/HTTP
        hostPort: 4318
        listenAddress: "127.0.0.1"
      - containerPort: 30317 # OTel Collector OTLP/gRPC
        hostPort: 4317
        listenAddress: "127.0.0.1"
      - containerPort: 30300 # Grafana
        hostPort: 3000
        listenAddress: "127.0.0.1"
      # 画面 (docs/cluster/argocd.md)。ArgoCD・Headlamp は ArgoCD が入れる。Backstage の分も先に開けておく
      - containerPort: 30080 # ArgoCD
        hostPort: 8080
        listenAddress: "127.0.0.1"
      - containerPort: 30466 # Headlamp
        hostPort: 4466
        listenAddress: "127.0.0.1"
      - containerPort: 30707 # Backstage
        hostPort: 7007
        listenAddress: "127.0.0.1"
      # 環境 (dev・prod) ごとの画面 (docs/cluster/environments.md、docs/cluster/temporal.md)。
      # extraPortMappings はクラスタを作るときにしか効かないので、足したら just down && just up で作り直す
      - containerPort: 30301 # dev の Grafana (Grafana の PR が使う)
        hostPort: 3001
        listenAddress: "127.0.0.1"
      - containerPort: 30302 # prod の Grafana
        hostPort: 3002
        listenAddress: "127.0.0.1"
      - containerPort: 30233 # dev の Temporal UI (proxy temporal-ui-embed)
        hostPort: 8233
        listenAddress: "127.0.0.1"
      - containerPort: 30234 # prod の Temporal UI
        hostPort: 8234
        listenAddress: "127.0.0.1"
  - role: worker
    # Tempo・Prometheus・Loki・Grafana の保存先。${HOME} は `just up` が展開する (kind 自体は環境変数を展開しない)。
    # PV (clusters/kind/storage) の nodeAffinity がこのラベルを指し、クラスタを作り直しても同じディレクトリを使う。
    labels:
      home-k8s/observability-storage: "true"
    extraMounts:
      - hostPath: ${HOME}/.local/share/home-k8s/observability
        containerPath: /var/local/home-k8s/observability
  - role: worker
networking:
  apiServerAddress: "127.0.0.1"
