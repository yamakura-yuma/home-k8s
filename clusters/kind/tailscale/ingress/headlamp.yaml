# Headlamp (https://headlamp.<tailnet>.ts.net)。ログインは Keycloak の OIDC (callback もこの URL。docs/cluster/kube-oidc.md)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: headlamp
      port:
        number: 80
  tls:
    - hosts:
        - headlamp
