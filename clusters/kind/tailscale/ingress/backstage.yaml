# Backstage (https://backstage.<tailnet>.ts.net)。Service backstage ではなく、ゲストのサインインの経路を拒む proxy backstage-tailnet につなぐ
# (clusters/kind/backstage/tailnet-proxy)。tailnet からはゲストでサインインできない
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  namespace: backstage
  # インターネットに出す (Tailscale Funnel。ゲストはブラウザだけで届く、docs/cluster/guest-access.md の「実装 (g2b)」)。
  # Funnel は経路を選べず host:443 を丸ごと出すので、先の proxy がインターネットからの要求を絞る。
  # Funnel を付けてよいのは Keycloak・Grafana (観測スタック)・Backstage の 3 つだけ (clusters/kind/tailscale/test_funnel.py が数える)
  annotations:
    tailscale.com/funnel: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: backstage-tailnet
      port:
        number: 80
  tls:
    - hosts:
        - backstage
