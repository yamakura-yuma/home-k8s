# 観測スタックの Grafana (https://grafana.<tailnet>.ts.net)。Service grafana ではなく、インターネット (Funnel) からのローカルのログイン
# (admin・viewer のパスワード) を塞ぐ proxy grafana-tailnet につなぐ (clusters/kind/observability/tailnet-proxy)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: grafana-tailnet
      port:
        number: 80
  tls:
    - hosts:
        - grafana
