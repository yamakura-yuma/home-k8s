# 環境 prod の Temporal UI (https://temporal-prod.<tailnet>.ts.net)。iframe 用の temporal-ui-embed ではなく chart の Web UI に直につなぐ
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-prod
  namespace: prod
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: temporal-web
      port:
        number: 8080
  tls:
    - hosts:
        - temporal-prod
