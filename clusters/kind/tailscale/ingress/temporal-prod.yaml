# 環境 prod の Temporal UI (https://temporal-prod.<tailnet>.ts.net)。Backstage のタブの iframe と同じ URL なので、
# chart の Web UI ではなく proxy temporal-ui-embed (X-Frame-Options を外し、frame-ancestors で Backstage だけに埋め込みを許す) につなぐ
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-prod
  namespace: prod
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: temporal-ui-embed
      port:
        number: 80
  tls:
    - hosts:
        - temporal-prod
