# Redis (1 Pod)。Dapr の state store の置き場 (clusters/kind/gitops-deployer の Component statestore)。公式イメージの素の Deployment
# (Bitnami は無料のイメージの配布が止まったので使わない)。namespace redis は Istio ambient に入れ、通信は ztunnel の mTLS で包む。
# パスワードは置かず、入口は AuthorizationPolicy で namespace gitops-deployer の ambient の Pod だけに絞る。docs/cluster/gitops-deployer-platform.md
apiVersion: v1
kind: Namespace
metadata:
  name: redis
  labels:
    istio.io/dataplane-mode: ambient
---
# データは PVC (kind の既定の StorageClass) に AOF で書く。Pod を作り直しても履歴が残る。クラスタを作り直せば消える
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis
  namespace: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  # RWO の PVC を 2 つの Pod で取り合わない
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          args:
            - --appendonly
            - "yes"
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: redis
---
# 入口を namespace gitops-deployer (ambient) の Pod だけに絞る。ztunnel が L4 で、mTLS の証明書の送り元 (namespace) を見て判定する。
# ambient に入っていない Pod からの平文は送り元が分からないので、この ALLOW に当たらず拒否される
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: redis
  namespace: redis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - gitops-deployer
