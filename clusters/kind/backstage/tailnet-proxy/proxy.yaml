# Backstage の tailnet の入口の proxy (Caddyfile)。ゲストのサインインの経路 /api/auth/guest を拒み、ほかは Service backstage へ渡す。
# tailnet からだけ通る (Ingress backstage の先)。localhost:7007 (NodePort) と share Pod は Service backstage に直につなぐので、ここを通らない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-tailnet
  labels:
    app.kubernetes.io/name: backstage-tailnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage-tailnet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage-tailnet
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2.11.6-alpine
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/caddy-config
            - name: XDG_DATA_HOME
              value: /tmp/caddy-data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          # 公式イメージの caddy には file capability (cap_net_bind_service) が付いていて、bounding set から落とすと exec が EPERM になる
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddyfile
          configMap:
            name: backstage-tailnet
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-tailnet
  labels:
    app.kubernetes.io/name: backstage-tailnet
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backstage-tailnet
  ports:
    - name: http
      port: 80
      targetPort: http
