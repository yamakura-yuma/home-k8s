# backstage/charts の backstage chart の values。
# ホストの localhost:7007 で開く (NodePort + kind の extraPortMappings)。
# イメージは repo の backstage/ から `just up` が手元で build して kind load したもの。
# レジストリから pull しないので、タグは固定して pullPolicy は Never にする。
# タグを変えるときは just/backstage.just の backstage_image と揃える。
backstage:
  image:
    registry: ""
    repository: home-k8s-backstage
    tag: "0.10.0"
    pullPolicy: Never

  # イメージの app-config.yaml に、下の appConfig (chart が ConfigMap にする) を重ねる
  args: ["--config", "app-config.yaml"]

  # GRAFANA_BASIC_AUTH (Grafana の閲覧用ユーザー backstage の資格情報)、GRAFANA_DEV_BASIC_AUTH・GRAFANA_PROD_BASIC_AUTH
  # (環境の Grafana の同じユーザーの資格情報)、ARGOCD_AUTH_TOKEN (ArgoCD の読み取り専用アカウント backstage の API トークン)。
  # どれも `just up` が Git の外のファイルから作る Secret を名前で参照する
  extraEnvVarsSecrets:
    - backstage-grafana
    - backstage-grafana-env
    - backstage-argocd

  # Azure のタブの資格情報 (AZURE_*)。`just up` が Git の外のファイル ~/.local/share/home-k8s/backstage/azure.env から Secret
  # backstage-azure を作る。ファイルが無いと Secret も無いので、optional にして Pod は起動させる (環境変数が無ければ
  # Azure のタブは「資格情報が無い」を出す。docs/cluster/backstage-azure.md)
  extraEnvVars:
    - name: AZURE_DOMAIN
      valueFrom:
        secretKeyRef:
          name: backstage-azure
          key: AZURE_DOMAIN
          optional: true
    - name: AZURE_TENANT_ID
      valueFrom:
        secretKeyRef:
          name: backstage-azure
          key: AZURE_TENANT_ID
          optional: true
    - name: AZURE_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: backstage-azure
          key: AZURE_CLIENT_ID
          optional: true
    - name: AZURE_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: backstage-azure
          key: AZURE_CLIENT_SECRET
          optional: true
    - name: AZURE_SUBSCRIPTION_ID
      valueFrom:
        secretKeyRef:
          name: backstage-azure
          key: AZURE_SUBSCRIPTION_ID
          optional: true

  appConfig:
    catalog:
      # home-k8s の catalog-info.yaml。ArgoCD と同じく GitHub の main を正本にする
      locations:
        - type: url
          target: https://github.com/yamakura-yuma/home-k8s/blob/main/catalog-info.yaml
        # TechDocs で文書を読むナレッジ。どちらも公開リポジトリで、catalog-info.yaml と mkdocs.yml を置いてある
        - type: url
          target: https://github.com/yamakura-yuma/knowledge-base/blob/main/catalog-info.yaml
        - type: url
          target: https://github.com/yamakura-yuma/dotfiles/blob/main/catalog-info.yaml

service:
  type: NodePort
  nodePorts:
    backend: 30707
