# Backstage のカタログに載せる home-k8s のエンティティ。Backstage (localhost:7007) が GitHub の main から読む
# (clusters/kind/backstage/values.yaml の catalog.locations)。
# エンティティのページには、grafana/dashboard-selector に合う Grafana のダッシュボードの一覧が出る。
# セレクタはダッシュボードの JSON の tags を見る。いま repo が Grafana に入れるダッシュボードはすべてこの 4 つの
# どれかのタグを持つので、全部が出る。書き方は docs/cluster/backstage.md
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: home-k8s
  description: kind クラスタで Kubernetes を学ぶ環境と、Claude Code・Orca の観測スタック
  annotations:
    github.com/project-slug: yamakura-yuma/home-k8s
    # docs/ を TechDocs で読む (mkdocs.yml)
    backstage.io/techdocs-ref: dir:.
    grafana/dashboard-selector: "tags @> 'claude-code' || tags @> 'claude-code-setting' || tags @> 'Kubernetes' || tags @> 'opentelemetry'"
  links:
    - url: http://localhost:3000
      title: Grafana
    - url: http://localhost:8080
      title: ArgoCD
    - url: http://localhost:4466
      title: Headlamp
spec:
  type: service
  lifecycle: experimental
  owner: user:yamakura-yuma
---
# 上の owner。ユーザーとグループは Keycloak から取り込まず、ここに静的に置く (docs/cluster/backstage.md の「ログインと権限」)。
# Keycloak でサインインした人は、ここに無くてもサインインできる (名前は Keycloak のユーザー名)。
# グループに入っているか (= 権限) は、サインインのときの Keycloak の groups クレームで決まる。ここの memberOf と members は書かない
# (書くと Keycloak とずれうる。Keycloak のグループを変えたら、ここは変えなくてよい)
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: yamakura-yuma
spec:
  memberOf: []
---
# Keycloak の realm home-k8s のグループ (表示用)。admins は書き込み (カタログの登録・削除など) ができ、viewers は読むだけ
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: admins
  description: 管理者。Keycloak のグループ admins。Backstage では何でもできる
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: viewers
  description: 閲覧者。Keycloak のグループ viewers。Backstage では読むだけ
spec:
  type: team
  children: []
---
# repo の中のサービスのエンティティ。サービスのコードの隣の catalog-info.yaml を読む (相対パスはこのファイルから)
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: home-k8s-services
spec:
  targets:
    - ./services/sample-api/catalog-info.yaml
