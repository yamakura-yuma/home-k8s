# kube-linter (just/ci.sh) の設定。対象は ArgoCD の Application が指す chart を helm template で描画した
# manifest と、repo の素の manifest。chart は上流のもので直せないので、導入時 (2026-10-03) に出ていた
# 違反 57 件を「現状」として検査ごとに除外してある。ここに無い検査は既定のまま有効で、新しい種類の違反は落ちる。
# 除外の件数は検査ごと (描画した chart の数)。減らせたら該当行を消すこと。
checks:
  exclude:
    - unset-cpu-requirements     # 20 件: kind の学習用で requests/limits を置いていない
    - unset-memory-requirements  # 20 件: 同上
    - no-read-only-root-fs       # 8 件: Prometheus・Loki・Tempo・Headlamp・otel-collector など上流の既定
    - sensitive-host-mounts      # 3 件: prometheus node-exporter が /proc・/sys・/ をマウントする (仕様)
    - run-as-non-root            # 2 件: 上流の既定
    - liveness-port              # 1 件: otel-collector の probe が宣言していないポートを指す (上流の既定)
    - readiness-port             # 1 件: 同上
    - host-pid                   # 1 件: node-exporter (仕様)
    - host-network               # 1 件: node-exporter (仕様)
    # 以下は gitops-deployer の基盤 (2026-10-11、docs/cluster/gitops-deployer-platform.md) の上流の manifest で出たもの
    - pdb-unhealthy-pod-eviction-policy  # 6 件: Knative・Dapr・testkube の PDB が unhealthyPodEvictionPolicy を書かない (上流の既定)
    - pdb-min-available              # 3 件: Knative の webhook・activator の PDB が 1 台の Deployment に minAvailable 1 を置く (上流の既定)
    - env-var-secret                 # 4 件: Knative の request-reply と testkube の API の環境変数名が SECRET を含む (値は秘密ではない、上流の既定)
    - drop-net-raw-capability        # 2 件: istio-cni と ztunnel が NET_RAW を使う (Pod の通信の向け替えに要る、仕様)
    - privilege-escalation-container # 2 件: istio-cni (SYS_ADMIN) と ztunnel (仕様)
    - no-anti-affinity               # 1 件: Dapr の scheduler の anti-affinity の topologyKey が zone (上流の既定)
