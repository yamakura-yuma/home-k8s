name: home-k8s-agent-config
version: 1.0.0
description: Agent configuration for the home-k8s project
author: yamakura-yuma

targets:
- claude

# The shared harness (rules, guard hooks, core-* skills, agents) from the dotfiles repo.
# 自分のパッケージは main を追う。外部パッケージは commit 固定。
# orca.yaml の setup が新しい worktree ごとに main の最新へ上げて展開する。
# `apm install` lands it in ./.claude/, never in ~/.claude/.
dependencies:
  apm:
  - git: https://github.com/yamakura-yuma/dotfiles.git
    path: core-principal
    ref: main
    alias: core-principal
    targets:
    - claude
  mcp: []

includes: auto
scripts: {}
