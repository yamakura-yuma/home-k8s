# home-k8s の Backstage の設定。イメージに入れ、kind クラスタで動かす (clusters/kind/backstage)。
# 画面はホストの localhost:7007 で開く (NodePort 30707 + kind の extraPortMappings)。
# フロントエンドもバックエンド (app-backend) が配るので、app と backend の baseUrl は同じにする。
app:
  title: home-k8s
  baseUrl: http://localhost:7007
  packages: all
  extensions:
    # カタログを入口にする
    - page:catalog:
        config:
          path: /
    # Grafana のダッシュボードの一覧を、注釈 grafana/dashboard-selector を持つエンティティのページに出す
    - entity-card:grafana/dashboards
    # アラートは使わない (Grafana にアラートのルールを置いていない)
    - entity-card:grafana/alerts: false
    # ArgoCD プラグイン (Roadie) の既定のタブとカードは、Component すべてに出る上に注釈 argocd/app-name が 1 つしか書けない。
    # 環境ごとの Application は環境のタブ (modules/environments/ArgoCdView.tsx) が出すので、プラグインの画面は止めて API の拡張だけを使う
    - entity-content:argocd/ArgoCdPage: false
    - entity-card:argocd/overviewCard: false
    - entity-card:argocd/historyCard: false

organization:
  name: home-k8s

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Temporal のタブの iframe (環境ごとの Web UI)。この 2 つのオリジンだけ埋め込みを許す (docs/cluster/temporal.md)
    frame-src: ["'self'", 'http://localhost:8233', 'http://localhost:8234']
  cors:
    origin: http://localhost:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # DB はインメモリの SQLite。カタログは Git から読み直せるので、Pod を作り直して消えても困らない
  database:
    client: better-sqlite3
    connection: ':memory:'

# Grafana の API はバックエンドのプロキシ経由で読む。資格情報はブラウザに渡らない。
# GRAFANA_BASIC_AUTH は Grafana の閲覧用ユーザー backstage の「ユーザー:パスワード」の base64。
# `just up` が Git の外のファイルから Secret backstage-grafana を作り、chart が環境変数にする
proxy:
  endpoints:
    '/grafana/api':
      target: http://grafana.observability.svc.cluster.local
      headers:
        Authorization: Basic ${GRAFANA_BASIC_AUTH}
    # 環境 (dev・prod) ごとの Grafana (clusters/kind/env-grafana)。経路は grafana.hosts[].proxyPath と同じ /grafana-<環境>/api
    # (host ごとに別でないと、プラグインが起動時に落とす)。GRAFANA_<環境>_BASIC_AUTH は環境の Grafana の閲覧用ユーザー backstage の
    # 「ユーザー:パスワード」の base64。`just up` が Git の外のファイルから Secret backstage-grafana-env を作り、chart が環境変数にする
    # (docs/cluster/backstage-grafana.md)。ダッシュボードの検索 (GET) だけを通す
    '/grafana-dev/api':
      target: http://grafana.dev.svc.cluster.local
      headers:
        Authorization: Basic ${GRAFANA_DEV_BASIC_AUTH}
      allowedMethods: [GET]
    '/grafana-prod/api':
      target: http://grafana.prod.svc.cluster.local
      headers:
        Authorization: Basic ${GRAFANA_PROD_BASIC_AUTH}
      allowedMethods: [GET]
    # ArgoCD の API。dev・prod の Application は同じ ArgoCD の中にあるので経路は 1 つ (Application の名前は環境のタブが注釈で渡す)。
    # ARGOCD_AUTH_TOKEN は ArgoCD の読み取り専用アカウント backstage の API トークン。`just up` が Git の外のファイルから
    # Secret backstage-argocd を作り、chart が環境変数にする。GET だけを通す (docs/cluster/backstage-argocd.md)
    '/argocd/api':
      target: http://argocd-server.argocd.svc.cluster.local/api/v1
      headers:
        Authorization: Bearer ${ARGOCD_AUTH_TOKEN}
      allowedMethods: [GET]
    # 環境 (dev・prod) ごとのサンプルの API (services/sample-api)。エンティティ sample-api の注釈
    # home-k8s/env.<環境>.api-proxy がこの経路を指す。経路の名前は <サービス>-<環境> (docs/cluster/environments.md)
    '/sample-api-dev':
      target: http://sample-api.dev.svc.cluster.local
      allowedMethods: [GET]
    '/sample-api-prod':
      target: http://sample-api.prod.svc.cluster.local
      allowedMethods: [GET]

argocd:
  # Application の名前のリンク先 (ブラウザが開く URL)
  baseUrl: http://localhost:8080
  # デプロイ履歴に出す件数。プラグインは未設定だと slice(0, -1) で最後の 1 件を落とす (履歴が 1 件なら空になる) ので、必ず書く
  revisionsToLoad: 10

# Grafana は host ごとに 1 つ。注釈 grafana/host-id で選び、無いエンティティ (home-k8s) は defaultHost の default (いままでの Grafana)。
# domain はダッシュボードのリンク先 (ブラウザが開く URL)。dev・prod の画面のポート (3001・3002) は kind-config の extraPortMappings
# (Temporal の PR #86 が足した)。環境のタブ (modules/environments/GrafanaView.tsx) が、環境の注釈から grafana/host-id を重ねて出す
grafana:
  defaultHost: default
  hosts:
    - id: default
      domain: http://localhost:3000
      proxyPath: /grafana/api
      unifiedAlerting: false
    - id: dev
      domain: http://localhost:3001
      proxyPath: /grafana-dev/api
      unifiedAlerting: false
    - id: prod
      domain: http://localhost:3002
      proxyPath: /grafana-prod/api
      unifiedAlerting: false

# Azure のタブ (@backstage-community/plugin-azure-sites)。読み取り用のサービスプリンシパルの資格情報を環境変数で受ける。
# 環境変数は Secret backstage-azure (任意) から来る。`just up` が Git の外のファイル
# ~/.local/share/home-k8s/backstage/azure.env から作る。ファイルが無いと Secret も無く、環境変数が無い項目は設定から消える。
# 資格情報が揃わないとバックエンドは公式のプラグインを載せず代役を載せ、Azure のタブは「資格情報が無い」を出す
# (packages/backend/src/azureSites.ts、docs/cluster/backstage-azure.md)
azureSites:
  domain: ${AZURE_DOMAIN}
  tenantId: ${AZURE_TENANT_ID}
  clientId: ${AZURE_CLIENT_ID}
  clientSecret: ${AZURE_CLIENT_SECRET}
  subscriptions:
    - id: ${AZURE_SUBSCRIPTION_ID}

# ログインはゲストだけ。127.0.0.1 と、人ごとの資格情報つきの share Pod にしか出さないので、production でもゲストを許す
auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

# TechDocs。catalog-info.yaml に backstage.io/techdocs-ref を持つエンティティの文書を、
# 開かれたときに Pod の中で mkdocs が build し (mkdocs はイメージに入れてある)、Pod の中に置いて配る。
# 置き場は Pod を作り直すと消えるが、次に開いたときに build し直すだけ。
# 文書は GitHub から読む。トークンは渡さない (公開リポジトリだけを読む。レート制限は docs/cluster/backstage.md)
techdocs:
  builder: local
  generator:
    runIn: local
    # mkdocs-material は既定で Google Fonts (fonts.googleapis.com) を読む。build の前に mkdocs.yml へ
    # theme.font: false を足し、文書の画面が外の fonts を読まないようにする (各リポの mkdocs.yml は変えない)。
    # mkdocs.yml が theme.font を自分で書いていれば、そちらが残る
    mkdocs:
      disableExternalFonts: true
  publisher:
    type: local

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, User]
  # 読み込む catalog-info.yaml (locations) は clusters/kind/backstage/values.yaml に置く。
  # ArgoCD と同じく GitHub の main を指すので、検証用のブランチではそこも書き換える
